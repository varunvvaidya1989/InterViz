name: SDLC - Agent control

on:
  issues:
    types: [opened, edited, labeled, reopened]
  push:
    branches: [main]
    paths: ['automation/**', '.github/workflows/agent-control.yml']
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: Trusted controller action; reconcile schedules ready ledger tasks
        type: choice
        options: [event, reconcile, worker, provider-check, adopt-submission, recover-publication]
        default: reconcile
        required: true
      role:
        description: Worker role; ignored unless action is worker
        type: choice
        options: [lead, coding, ui-ux, devops, review, qa]
        default: lead
      task-id:
        description: Existing queued task ID; never a free-form instruction
        type: string
      revision:
        description: Exact 40-character target commit; required by worker policy
        type: string
      pull-request:
        description: Concrete founder-authored lead-rework PR to submit for fresh review
        type: string
      accept-ci-workflow-blob:
        description: Optional separately founder-accepted exact infrastructure CI blob SHA
        type: string
      source-run-id:
        description: Failed trusted worker run containing the exact retained source
        type: string
      plan-hash:
        description: Existing approved plan hash; adoption cannot approve a changed plan
        type: string
      lead-contract:
        description: Explicit bounded lead-rework contract recorded in the audit
        type: string

permissions: {}

concurrency:
  group: sdlc-ledger
  cancel-in-progress: false

jobs:
  control:
    if: >-
      vars.SDLC_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'push' ||
      contains(fromJSON(vars.SDLC_TRUSTED_ACTORS || '[]'), github.actor) ||
      (github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      checks: write
    env:
      SDLC_ACTION: ${{ inputs.action || ((github.event_name == 'schedule' || github.event_name == 'push') && 'reconcile') || 'event' }}
      SDLC_ROLE: ${{ inputs.role || 'lead' }}
      SDLC_TASK_ID: ${{ inputs.task-id || '' }}
      SDLC_TARGET_REVISION: ${{ inputs.revision || '' }}
      SDLC_PULL_REQUEST: ${{ inputs.pull-request || '' }}
      SDLC_ACCEPT_CI_WORKFLOW_BLOB: ${{ inputs.accept-ci-workflow-blob || '' }}
      SDLC_SOURCE_RUN_ID: ${{ inputs.source-run-id || '' }}
      SDLC_PLAN_HASH: ${{ inputs.plan-hash || '' }}
      SDLC_LEAD_CONTRACT: ${{ inputs.lead-contract || '' }}
      SDLC_OUTPUT_DIR: .sdlc/output
    steps:
      - name: Check out trusted default-branch controller only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Restore authenticated controller ledger
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          SDLC_STATE_SIGNING_KEY: ${{ secrets.SDLC_STATE_SIGNING_KEY }}
        run: python -m automation.cli state --action restore
      - name: Ingest trusted actor event
        if: env.SDLC_ACTION == 'event'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m automation.cli event --event-name "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH"
      - name: Submit founder-approved bounded lead rework for fresh review
        if: env.SDLC_ACTION == 'adopt-submission'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m automation.cli adopt-submission
          --task-id "$SDLC_TASK_ID"
          --revision "$SDLC_TARGET_REVISION"
          --pull-request "$SDLC_PULL_REQUEST"
          --plan-hash "$SDLC_PLAN_HASH"
          --lead-contract "$SDLC_LEAD_CONTRACT"
      - name: Recover exact retained first publication
        id: publication_recovery
        if: env.SDLC_ACTION == 'recover-publication'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m automation.cli recover-publication
          --task-id "$SDLC_TASK_ID"
          --revision "$SDLC_TARGET_REVISION"
          --pull-request "$SDLC_PULL_REQUEST"
          --source-run-id "$SDLC_SOURCE_RUN_ID"
          --accept-ci-workflow-blob "$SDLC_ACCEPT_CI_WORKFLOW_BLOB"
      - name: Build trusted worker execution image
        if: env.SDLC_ACTION == 'worker'
        run: docker build -f infra/Dockerfile.agent -t systemslabs-agent:local .
      - name: Prepare host for the nested worker sandbox
        if: env.SDLC_ACTION == 'worker' || env.SDLC_ACTION == 'provider-check'
        run: python infra/prepare_runner.py
      - name: Execute queued Codex worker through isolated adapter
        if: env.SDLC_ACTION == 'worker'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python -m automation.cli worker
          --role "$SDLC_ROLE"
          --task-id "$SDLC_TASK_ID"
          --revision "$SDLC_TARGET_REVISION"
          --event-path "$GITHUB_EVENT_PATH"
      - name: Minimal provider connectivity verification
        if: env.SDLC_ACTION == 'provider-check'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          docker build -f infra/Dockerfile.agent -t systemslabs-agent:local .
          python -m automation.cli probe
      - name: Reconcile policy and schedule permitted next work
        if: >-
          always() && steps.restore.outcome == 'success' &&
          (env.SDLC_ACTION != 'recover-publication' || steps.publication_recovery.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          SDLC_PUBLISH_TOKEN: ${{ secrets.SDLC_PUBLISH_TOKEN }}
        run: python -m automation.cli reconcile --event-path "$GITHUB_EVENT_PATH"
      - name: Save signed ledger with compare-and-swap
        if: always() && steps.restore.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SDLC_STATE_SIGNING_KEY: ${{ secrets.SDLC_STATE_SIGNING_KEY }}
        run: python -m automation.cli state --action save
      - name: Retain non-secret run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdlc-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sdlc/output/
          if-no-files-found: ignore
          retention-days: 7
