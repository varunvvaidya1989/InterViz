name: SDLC - Founder approval
run-name: "Founder approval ${{ inputs.kind }} ${{ inputs.release-id }} ${{ inputs.expected-hash }} ${{ inputs.revision }}"

on:
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [plan, release]
        required: true
      release-id:
        type: string
        required: true
      expected-hash:
        description: Version selected by the dashboard
        type: string
        required: true
      revision:
        description: Revision selected by the dashboard
        type: string
        required: true

permissions: {}
concurrency:
  group: sdlc-ledger
  cancel-in-progress: false

jobs:
  approve:
    if: >-
      vars.SDLC_ENABLED == 'true' &&
      github.actor == vars.SDLC_FOUNDER_LOGIN &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      checks: write
    env:
      SDLC_APPROVAL_KIND: ${{ inputs.kind }}
      SDLC_RELEASE_ID: ${{ inputs.release-id }}
      SDLC_EXPECTED_HASH: ${{ inputs.expected-hash }}
      SDLC_TARGET_REVISION: ${{ inputs.revision }}
      SDLC_OUTPUT_DIR: .sdlc/output
    steps:
      - name: Check out trusted default-branch controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Restore signed controller state
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          SDLC_STATE_SIGNING_KEY: ${{ secrets.SDLC_STATE_SIGNING_KEY }}
        run: python -m automation.cli state --action restore
      - name: Record authenticated founder approval of the displayed version
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m automation.cli approve
          --kind "$SDLC_APPROVAL_KIND"
          --release-id "$SDLC_RELEASE_ID"
          --expected-hash "$SDLC_EXPECTED_HASH"
          --revision "$SDLC_TARGET_REVISION"
      - name: Continue approved work
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m automation.cli reconcile
      - name: Save signed controller state
        if: always() && steps.restore.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SDLC_STATE_SIGNING_KEY: ${{ secrets.SDLC_STATE_SIGNING_KEY }}
        run: python -m automation.cli state --action save
      - name: Retain approval evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: founder-approval-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sdlc/output/
          if-no-files-found: ignore
          retention-days: 14
