name: SDLC - Infrastructure CI
run-name: "SDLC CI ${{ github.event_name }} pr=${{ inputs.pull-request || github.event.pull_request.number || 0 }} sha=${{ inputs.revision || github.event.pull_request.head.sha || github.sha }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      pull-request:
        type: string
        default: "0"
      revision:
        type: string
        description: Exact queued PR head for bot-created pull requests

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sdlc-infrastructure-ci-${{ inputs.pull-request || github.event.pull_request.number || github.ref }}-${{ inputs.revision || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  target:
    name: Verify queued PR head
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify current same-repository PR via authenticated API
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull-request }}
          TARGET_SHA: ${{ inputs.revision }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re, urllib.request
          number, sha = os.environ['PR_NUMBER'], os.environ['TARGET_SHA']
          assert re.fullmatch(r'[1-9][0-9]*', number)
          assert re.fullmatch(r'[a-f0-9]{40}', sha)
          repo = os.environ['GITHUB_REPOSITORY']
          url = os.environ['GITHUB_API_URL'] + '/repos/' + repo + '/pulls/' + number
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req, timeout=30) as response:
              pr = json.load(response)
          assert pr['state'] == 'open'
          assert pr['head']['sha'] == sha
          assert pr['head']['repo']['full_name'] == repo
          assert pr['base']['repo']['full_name'] == repo
          assert pr['base']['ref'] == os.environ['DEFAULT_BRANCH']
          PYTHON
  infrastructure:
    needs: target
    if: always() && (needs.target.result == 'success' || github.event_name != 'workflow_dispatch')
    name: sdlc-infrastructure-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SDLC_TARGET_REVISION: ${{ inputs.revision || github.event.pull_request.head.sha || github.sha }}
      SDLC_OUTPUT_DIR: .sdlc/output
    steps:
      - name: Check out tested revision without retained credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "$SDLC_TARGET_REVISION"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Run infrastructure unit tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sdlc/output
          python -m unittest discover -s automation -p 'test_*.py' -v 2>&1 | tee .sdlc/output/infrastructure-unit-tests.log
      - name: Validate infrastructure contract for this exact commit
        run: python -m automation.cli validate --scope infrastructure --revision "$SDLC_TARGET_REVISION"
      - name: Retain CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdlc-infrastructure-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sdlc/output/
          if-no-files-found: ignore
          retention-days: 7
