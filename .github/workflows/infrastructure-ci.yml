name: SDLC - Infrastructure CI
run-name: "SDLC CI ${{ github.event_name }} pr=${{ inputs.pull-request || github.event.pull_request.number || 0 }} sha=${{ inputs.revision || github.event.pull_request.head.sha || github.sha }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      pull-request:
        type: string
        default: "0"
      revision:
        type: string
        description: Exact queued PR head for bot-created pull requests

permissions:
  contents: read

concurrency:
  group: sdlc-infrastructure-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: sdlc-infrastructure-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SDLC_TARGET_REVISION: ${{ inputs.revision || github.event.pull_request.head.sha || github.sha }}
      SDLC_OUTPUT_DIR: .sdlc/output
    steps:
      - name: Check out tested revision without retained credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Run infrastructure unit tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sdlc/output
          python -m unittest discover -s automation -p 'test_*.py' -v 2>&1 | tee .sdlc/output/infrastructure-unit-tests.log
      - name: Validate infrastructure contract for this exact commit
        run: python -m automation.cli validate --scope infrastructure --revision "$SDLC_TARGET_REVISION"
      - name: Retain CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdlc-infrastructure-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sdlc/output/
          if-no-files-found: ignore
          retention-days: 7
