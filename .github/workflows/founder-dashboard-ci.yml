name: SDLC - Founder dashboard CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: founder-dashboard-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: founder-dashboard-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact tested revision without retained credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test dashboard and founder approval transport with local fixtures
        run: python -m unittest discover -s founder_dashboard -p 'test_*.py' -v
