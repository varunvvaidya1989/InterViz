name: SDLC - Review and integration

on:
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: [SDLC - Infrastructure CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        description: Reconcile evidence or run a previously queued independent review
        type: choice
        options: [reconcile, review]
        default: reconcile
        required: true
      task-id:
        description: Queued review task ID
        type: string
      revision:
        description: Exact PR head commit reviewed by this task
        type: string

permissions: {}

concurrency:
  group: sdlc-ledger
  cancel-in-progress: false

jobs:
  review-and-integrate:
    if: >-
      vars.SDLC_ENABLED == 'true' &&
      ((github.event_name == 'workflow_run' &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (contains(fromJSON(vars.SDLC_TRUSTED_ACTORS || '[]'), github.actor) &&
      (github.event_name != 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      checks: write
    env:
      SDLC_ACTION: ${{ inputs.action || 'reconcile' }}
      SDLC_TASK_ID: ${{ inputs.task-id || '' }}
      SDLC_TARGET_REVISION: ${{ inputs.revision || '' }}
      SDLC_OUTPUT_DIR: .sdlc/output
    steps:
      - name: Check out trusted controller, never PR head code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Restore signed ledger
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          SDLC_STATE_SIGNING_KEY: ${{ secrets.SDLC_STATE_SIGNING_KEY }}
        run: python -m automation.cli state --action restore
      - name: Record exact-commit review and CI facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m automation.cli event --event-name "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH"
      - name: Build trusted independent-review image
        if: env.SDLC_ACTION == 'review'
        run: docker build -f infra/Dockerfile.agent -t systemslabs-agent:local .
      - name: Run queued independent Codex diff-only review
        if: env.SDLC_ACTION == 'review'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python -m automation.cli worker
          --role review
          --task-id "$SDLC_TASK_ID"
          --revision "$SDLC_TARGET_REVISION"
          --event-path "$GITHUB_EVENT_PATH"
      - name: Reconcile bounded debate and merge eligibility
        if: always() && steps.restore.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m automation.cli reconcile --event-path "$GITHUB_EVENT_PATH"
      - name: Save signed ledger
        if: always() && steps.restore.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SDLC_STATE_SIGNING_KEY: ${{ secrets.SDLC_STATE_SIGNING_KEY }}
        run: python -m automation.cli state --action save
      - name: Retain independent-review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdlc-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sdlc/output/
          if-no-files-found: ignore
          retention-days: 7
